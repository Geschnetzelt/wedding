<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danke! | Anna-Lisa & Jonas</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        .success-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
            background: var(--color-bg);
        }
        .success-content {
            max-width: 500px;
        }
        .success-content h1 {
            font-family: var(--font-serif);
            font-size: 3rem;
            color: var(--color-primary);
            margin-bottom: 1rem;
        }
        .success-content p {
            font-size: 1.1rem;
            color: var(--color-text-light);
            margin-bottom: 2rem;
        }
        .success-content a {
            display: inline-block;
            padding: 0.75rem 2rem;
            background: var(--color-primary);
            color: var(--color-blush);
            border-radius: 6px;
            text-decoration: none;
            transition: opacity 0.2s;
        }
        .success-content a:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="success-page">
        <div class="success-content">
            <h1>Danke!</h1>
            <p>Eure Rückmeldung ist bei uns angekommen. Wir freuen uns auf euch!</p>
            <a href="/">Zurück zur Startseite</a>
        </div>
    </div>
</body>
</html>
