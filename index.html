<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unsere Hochzeit | Anna-Lisa & Jonas</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="password-gate" class="password-gate">
        <div class="password-box">
            <h2>Willkommen!</h2>
            <p>Bitte gib das Passwort ein:</p>
            <input type="password" id="password-input" placeholder="Passwort" autofocus>
            <button id="password-submit">Eintreten</button>
            <p id="password-error" class="password-error"></p>
        </div>
    </div>

    <!-- Content wird nach Login dynamisch geladen -->
    <div id="protected-content"></div>

    <script>
        // Password protection with hashed password (SHA-256)
        const PASSWORD_HASH = 'c4806e3cc4fe9e22d04d866d5f9c5ae1837b7a8ddbce7b918a0608a0231803e9';
        const AUTH_TOKEN_KEY = 'weddingAuth2026';
        const gate = document.getElementById('password-gate');
        const input = document.getElementById('password-input');
        const submit = document.getElementById('password-submit');
        const error = document.getElementById('password-error');

        // Hash function for password verification
        async function hashPassword(password) {
            const encoder = new TextEncoder();
            const data = encoder.encode(password + 'hochzeit2026salt');
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        // Generate auth token for form submission (date-based, valid for current day)
        function generateAuthToken() {
            const date = new Date().toISOString().split('T')[0];
            return btoa(date + AUTH_TOKEN_KEY).substring(0, 24);
        }

        // Set auth token in form
        function setAuthToken() {
            const tokenField = document.getElementById('auth-token');
            if (tokenField) {
                tokenField.value = generateAuthToken();
            }
        }

        // Load protected content
        async function loadContent() {
            try {
                const response = await fetch('content.html');
                if (response.ok) {
                    const html = await response.text();
                    document.getElementById('protected-content').innerHTML = html;
                    initializeContent();
                }
            } catch (err) {
                console.error('Failed to load content:', err);
            }
        }

        // Initialize videos, forms, etc. after content is loaded
        function initializeContent() {
            setAuthToken();
            initializeVideos();
            initializeRsvpForm();
        }

        // Video sync logic
        function initializeVideos() {
            const jonasVideo = document.getElementById('jonas-video');
            const aliVideo = document.getElementById('ali-video');

            if (!jonasVideo || !aliVideo) return;

            let aliEnded = false;
            let jonasEnded = false;

            function startBothVideos() {
                aliEnded = false;
                jonasEnded = false;
                jonasVideo.currentTime = 3;
                aliVideo.currentTime = 0;
                jonasVideo.play();
                aliVideo.play();
            }

            aliVideo.addEventListener('ended', () => {
                aliEnded = true;
                if (jonasEnded) {
                    setTimeout(startBothVideos, 1000);
                } else {
                    setTimeout(() => {
                        if (jonasEnded) startBothVideos();
                    }, 1000);
                }
            });

            jonasVideo.addEventListener('ended', () => {
                jonasEnded = true;
                if (aliEnded) {
                    startBothVideos();
                }
            });

            let loadedCount = 0;
            function onLoaded() {
                loadedCount++;
                if (loadedCount === 2) {
                    startBothVideos();
                }
            }

            if (jonasVideo.readyState >= 1) {
                onLoaded();
            } else {
                jonasVideo.addEventListener('loadedmetadata', onLoaded);
            }

            if (aliVideo.readyState >= 1) {
                onLoaded();
            } else {
                aliVideo.addEventListener('loadedmetadata', onLoaded);
            }
        }

        // RSVP Form logic
        function initializeRsvpForm() {
            const rsvpForm = document.getElementById('rsvp-form');
            if (!rsvpForm) return;

            rsvpForm.addEventListener('submit', async (e) => {
                e.preventDefault();

                const formData = new FormData(rsvpForm);

                try {
                    const response = await fetch('/', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                        body: new URLSearchParams(formData).toString()
                    });

                    if (response.ok) {
                        const attendance = formData.get('attendance');
                        const messageEl = document.getElementById('rsvp-success-message');

                        if (attendance === 'ja') {
                            messageEl.textContent = 'Eure Rückmeldung ist bei uns angekommen. Wir freuen uns auf euch!';
                        } else {
                            messageEl.textContent = 'Eure Rückmeldung ist bei uns angekommen. Schade, dass ihr nicht dabei sein könnt!';
                        }

                        rsvpForm.classList.add('hidden');
                        document.getElementById('rsvp-success').classList.remove('hidden');
                    } else {
                        alert('Es gab einen Fehler. Bitte versuche es erneut.');
                    }
                } catch (error) {
                    alert('Es gab einen Fehler. Bitte versuche es erneut.');
                }
            });
        }

        // RSVP Form toggle (global function for onclick)
        function toggleRsvpForm() {
            const formContainer = document.getElementById('rsvp-form-container');
            const tile = document.getElementById('rsvp-tile');
            formContainer.classList.toggle('expanded');
            tile.classList.toggle('active');

            if (formContainer.classList.contains('expanded')) {
                setTimeout(() => {
                    formContainer.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }, 100);
            }
        }

        // Check if already authenticated
        if (sessionStorage.getItem('authenticated') === 'true') {
            gate.style.display = 'none';
            loadContent();
        }

        async function checkPassword() {
            const inputHash = await hashPassword(input.value);

            if (inputHash === PASSWORD_HASH) {
                sessionStorage.setItem('authenticated', 'true');
                gate.style.display = 'none';
                loadContent();
            } else {
                error.textContent = 'Falsches Passwort';
                input.value = '';
            }
        }

        submit.addEventListener('click', checkPassword);
        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') checkPassword();
        });
    </script>
</body>
</html>
